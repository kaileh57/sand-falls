colors = ["#3b2a17", "#362614", "#402e1a"]

[[material]]
name = "lava"
state = "liquid"
density = 250
spread = 3
temp = 1200
cooling = 2
conductivity = 40
viscosity = 160
opacity = 255
light = "#ff6a1f"
freeze = { at = 700, into = "basalt" }
colors = ["#ff5a10", "#f04a08", "#ff7a20"]

[[material]]
name = "molten_metal"
