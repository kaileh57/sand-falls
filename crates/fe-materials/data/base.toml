# Dust: fine powder kicked up by explosions and shattering. It is a gas a
# little heavier than air, so it hangs and drifts, settling slowly, and fades
# after about eight seconds. Appended last so existing material ids stay the same.
[[material]]
name = "dust"
state = "gas"
density = 1
spread = 3
opacity = 100
lifetime = [200, 255]
lifetime_rate = "30%"
colors = ["#a89e90", "#988e80", "#b4aa9c"]

# Charcoal: what is left of a burnt trunk or beam once the flames have passed.
# It smoulders for about fifteen seconds, dim red, giving off smoke, and slowly
# crumbles to smoke and a little ash, so a burned forest ends in smoking black
# stumps. Water puts it out and leaves coal.
[[material]]
name = "charcoal"
state = "static"
density = 50
hp = 8
debris = "ember"
lifetime = [200, 255]
lifetime_rate = "20%"
decay = "smoke"
residue = { into = "ash", chance = "15%" }
hold_temp = 330
light = "#3a0e02"
spawn = { into = "smoke", chance = "3%", dir = "up" }
colors = ["#1c1412", "#241815", "#3a1a10", "#2a1612"]

# Flash: the white-hot core of a large blast. It lasts a few ticks and turns
# into the fireball. Blasts of radius 12 and up fill their inner third with it,
# and the renderer spreads its light far, so a big charge lights the whole room.
# Appended last so existing material ids stay the same.
[[material]]
name = "flash"
state = "fire"
temp = 1500
hold_temp = 1500
lifetime = [2, 5]
decay = "fire"
light = "#fff0c8"
colors = ["#fffbe8", "#fff6d0", "#ffeeb8"]

# Burning oil: oil that has caught fire stays a liquid and burns where it lies,
# throwing flames up and heating the oil next to it, so a slick or a spill
# burns across instead of flashing once and going out. It floats on water.
[[material]]
name = "burning_oil"
state = "liquid"
density = 80
spread = 7
opacity = 140
viscosity = 60
conductivity = 24
hold_temp = 420
lifetime = [100, 200]
lifetime_rate = "50%"
decay = "smoke"
light = "#ff5a14"
spawn = { into = "fire", chance = "25%", dir = "up" }
colors = ["#d2501a", "#b8400e", "#e86420"]

