density = 160
spread = 2
temp = 1700
cooling = 2
viscosity = 200
opacity = 200
light = "#ff9040"
freeze = { at = 1400, into = "glass" }
colors = ["#ffb070", "#ffa060"]

[[material]]
name = "acid"
state = "liquid"
density = 110
spread = 8
opacity = 40
light = "#2a8a20"
