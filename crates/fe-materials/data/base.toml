# Built-in material set for falling-engine.
#
# Temperatures are in degrees C. Chances are per tick, written as "5%" or "1/20".
# "air" (id 0) and "boundary" (id 1) are added automatically and cannot be redefined.
# Materials are listed in id order: appending keeps existing ids stable, inserting does not.

# ---------------------------------------------------------------- terrain

[[material]]
name = "bedrock"
state = "static"
density = 300
anchored = true
indestructible = true
colors = ["#2a2730", "#25222b", "#2f2b35"]

[[material]]
name = "stone"
state = "static"
density = 250
hp = 60
debris = "rubble"
fracture = 400
conductivity = 30
melt = { at = 1200, into = "lava" }
colors = ["#6b6870", "#646169", "#726f77", "#5d5a62"]

[[material]]
name = "soil"
state = "static"
density = 160
hp = 14
debris = "dirt"
fracture = 150
colors = ["#5a3d27", "#553923", "#61432b", "#4f3520"]

[[material]]
name = "dirt"
state = "powder"
density = 140
slide = "30%"
colors = ["#6b4a30", "#64452c", "#714f34"]

[[material]]
name = "mud"
state = "powder"
density = 150
slide = "8%"
colors = ["#4a3522", "#45311f", "#4f3925"]

[[material]]
name = "sand"
state = "powder"
density = 150
melt = { at = 1700, into = "molten_glass" }
colors = ["#e0c58a", "#d8bb7c", "#e6cd96", "#cfb172"]

[[material]]
name = "gravel"
state = "powder"
density = 170
slide = "60%"
colors = ["#807a74", "#77716b", "#89837d"]

[[material]]
name = "rubble"
state = "powder"
density = 170
slide = "45%"
colors = ["#77737b", "#6c6870", "#827e86", "#8a5a4a"]

# ---------------------------------------------------------------- liquids

[[material]]
name = "water"
state = "liquid"
density = 100
spread = 10
conductivity = 60
opacity = 50
viscosity = 20
freeze = { at = -10, into = "ice" }
melt = { at = 100, into = "steam" }
